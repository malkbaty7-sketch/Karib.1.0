name: Flutter APK Builder Connector

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # التوجيه لمجلد katib_app لتركيب الاعتمادات
      - name: Install Dependencies
        working-directory: ./katib_app
        run: flutter pub get

      # التوجيه لمجلد katib_app لبناء الـ APK
      - name: Build Android APK
        working-directory: ./katib_app
        run: flutter build apk --release

      # رفع ملف الـ APK الناتج من داخل مجلد katib_app
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-release-apk
          path: katib_app/build/app/outputs/flutter-apk/app-release.apk
